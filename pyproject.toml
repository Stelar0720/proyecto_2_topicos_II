[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "plaza-reserva"
version = "0.1.0"
description = "Base académica de Plaza Reserva; historias de estacionamiento pendientes"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.139,<1",
  "uvicorn>=0.34,<1",
  "SQLAlchemy>=2.0.40,<2.2",
  "alembic>=1.16,<2",
  "jinja2>=3.1.6,<4",
  "python-dotenv>=1.1,<2",
  "psycopg[binary]>=3.2,<4",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1"]

[project.scripts]
plaza = "plaza_reserva.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plaza_reserva = ["templates/*.html", "templates/**/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
