<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Plaza Reserva{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
  <script src="{{ url_for('static', path='/auth.js') }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Plaza Reserva, inicio"><span class="brand-mark">P</span><span>Plaza Reserva</span></a>
    <nav aria-label="Navegación principal">
      <a href="/">Inicio</a><a href="/reservar">Reservar</a><a href="/mi-reserva">Mi reserva</a>
      <a class="staff-link" href="/acceso">Acceso del personal</a>
    </nav>
  </header>
  <main id="contenido">{% block content %}{% endblock %}</main>
  <footer>Plaza Reserva <span>·</span> Proyecto académico <span>·</span> Plaza comercial ficticia</footer>
</body></html>
