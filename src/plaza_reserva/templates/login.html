{% extends 'base.html' %}
{% block title %}Acceso del personal · Plaza Reserva{% endblock %}
{% block content %}
<p class="eyebrow">Área del personal</p><h1>Iniciar sesión</h1>
<p>Utiliza la cuenta creada por el responsable del proyecto. No hay registro público.</p>
<form id="login-form">
 <label for="username">Usuario</label><input id="username" name="username" autocomplete="username" maxlength="80" required>
 <label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required>
 <button type="submit">Entrar</button><p id="login-message" role="status" aria-live="polite"></p>
</form>
{% endblock %}
